name: Agent format sandbox binding

on:
  push:
    branches:
      - agent/sandbox-run-plan-binding
    paths-ignore:
      - .agent-format-marker/**

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format MPRD sandbox binding
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/mprd-core/src
          if ! git diff --cached --quiet; then
            git commit -m "Format sandbox execution binding"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
