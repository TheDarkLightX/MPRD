name: Agent apply sandbox binding integration

on:
  push:
    branches:
      - agent/sandbox-run-plan-binding

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Integrate sandbox action and validate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          lib_path = Path("crates/mprd-core/src/lib.rs")
          lib = lib_path.read_text()
          module_line = "pub mod sandbox_execution_binding;"
          if module_line not in lib:
              anchor = "pub mod registry;"
              if anchor not in lib:
                  raise SystemExit("mprd-core lib module anchor drifted")
              lib = lib.replace(anchor, f"{anchor}\n{module_line}", 1)
              lib_path.write_text(lib)

          validation_path = Path("crates/mprd-core/src/validation.rs")
          validation = validation_path.read_text()
          constant = "pub const ACTION_TYPE_SANDBOX_RUN_V1: &str = crate::sandbox_execution_binding::ACTION_TYPE_SANDBOX_RUN_V1;"
          if constant not in validation:
              anchor = 'pub const ACTION_TYPE_HTTP_CALL_V1: &str = "http_call";'
              if anchor not in validation:
                  raise SystemExit("validation action constant anchor drifted")
              validation = validation.replace(anchor, f"{anchor}\n{constant}", 1)

          match_arm = """        ACTION_TYPE_SANDBOX_RUN_V1 => {
              crate::sandbox_execution_binding::validate_sandbox_run_params_v1(params)
                  .map_err(|error| MprdError::InvalidInput(error.to_string()))
          }
          """
          if match_arm not in validation:
              anchor = """        _ => Err(MprdError::InvalidInput(format!(
                      \"unsupported action_type (v1): {action_type}\"
                  ))),
          """
              if anchor not in validation:
                  raise SystemExit("validation match fallback anchor drifted")
              validation = validation.replace(anchor, match_arm + anchor, 1)
          validation_path.write_text(validation)
          PY

          cargo fmt --all
          cargo test -p mprd-core sandbox_execution_binding
          cargo test -p mprd-core
          cargo clippy -p mprd-core --all-targets -- -D warnings

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/mprd-core/src
          if ! git diff --cached --quiet; then
            git commit -m "Integrate sandbox_run into MPRD action validation"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
