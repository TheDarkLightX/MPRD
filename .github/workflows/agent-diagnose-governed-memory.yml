name: Agent diagnose governed memory

on:
  push:
    branches:
      - agent/governed-memory-mutations
    paths-ignore:
      - .agent-ci-diagnostics/**

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Apply bounded correctness fixes and capture diagnostics
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p .agent-ci-diagnostics

          python3 - <<'PY'
          from pathlib import Path

          governed_path = Path("crates/mprd-core/src/policy_algebra/governed_memory.rs")
          governed = governed_path.read_text()
          governed_replacements = {
              """        let mut policy = MemoryAdmissionPolicy::default();
                  policy.allow_global = true;
          """: """        let policy = MemoryAdmissionPolicy {
                      allow_global: true,
                      ..MemoryAdmissionPolicy::default()
                  };
          """,
              """        let mut policy = MemoryAdmissionPolicy::default();
                  policy.max_ttl_ms = Some(1_000);
          """: """        let policy = MemoryAdmissionPolicy {
                      max_ttl_ms: Some(1_000),
                      ..MemoryAdmissionPolicy::default()
                  };
          """,
          }
          for old, new in governed_replacements.items():
              if old in governed:
                  governed = governed.replace(old, new, 1)
              elif new not in governed:
                  raise SystemExit(f"governed-memory snippet drifted: {old!r}")
          governed_path.write_text(governed)

          bdd_path = Path("crates/mprd-core/src/policy_algebra/bdd.rs")
          bdd = bdd_path.read_text()
          old = """            let deny_soft = b.apply(Op::And, not_a, not_n)?;
                      Ok((deny_soft, n))
          """
          new = """            let deny_soft = b.apply(Op::And, not_a, not_n)?;
                      // `evaluate` makes Not fail closed when any signal in its subtree is
                      // missing. Preserve that semantics in the ROBDD instead of treating a
                      // missing value bit as ordinary false and inverting it to allow.
                      let mut all_present = BddId::TRUE;
                      for atom in p.atoms() {
                          let present = b.var(&bit_present_name(&atom, limits)?)?;
                          all_present = b.apply(Op::And, all_present, present)?;
                      }
                      let allow = b.apply(Op::And, all_present, deny_soft)?;
                      Ok((allow, n))
          """
          if old in bdd:
              bdd = bdd.replace(old, new, 1)
          elif new not in bdd:
              raise SystemExit("ROBDD Not lowering snippet drifted")
          bdd_path.write_text(bdd)
          PY

          cargo fmt --all

          set +e
          cargo test --workspace \
            > .agent-ci-diagnostics/workspace-test.full.log 2>&1
          test_status=$?
          cargo clippy --workspace --all-targets -- -D warnings \
            > .agent-ci-diagnostics/workspace-clippy.full.log 2>&1
          clippy_status=$?
          set -e

          tail -n 260 .agent-ci-diagnostics/workspace-test.full.log \
            > .agent-ci-diagnostics/workspace-test.txt
          tail -n 260 .agent-ci-diagnostics/workspace-clippy.full.log \
            > .agent-ci-diagnostics/workspace-clippy.txt
          rm .agent-ci-diagnostics/*.full.log

          printf 'workspace_test=%s\nworkspace_clippy=%s\n' \
            "$test_status" "$clippy_status" \
            > .agent-ci-diagnostics/status.txt

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/mprd-core/src .agent-ci-diagnostics/*.txt
          if ! git diff --cached --quiet; then
            git commit -m "fix: preserve fail-closed missing semantics in ROBDD Not"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
