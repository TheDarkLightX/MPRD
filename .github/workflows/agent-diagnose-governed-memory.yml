name: Agent diagnose governed memory

on:
  push:
    branches:
      - agent/governed-memory-mutations
    paths-ignore:
      - .agent-ci-diagnostics/**

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Apply narrow lint fixes and capture bounded diagnostics
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p .agent-ci-diagnostics

          python3 - <<'PY'
          from pathlib import Path

          path = Path("crates/mprd-core/src/policy_algebra/governed_memory.rs")
          source = path.read_text()
          replacements = {
              """        let mut policy = MemoryAdmissionPolicy::default();
                  policy.allow_global = true;
          """: """        let policy = MemoryAdmissionPolicy {
                      allow_global: true,
                      ..MemoryAdmissionPolicy::default()
                  };
          """,
              """        let mut policy = MemoryAdmissionPolicy::default();
                  policy.max_ttl_ms = Some(1_000);
          """: """        let policy = MemoryAdmissionPolicy {
                      max_ttl_ms: Some(1_000),
                      ..MemoryAdmissionPolicy::default()
                  };
          """,
          }
          for old, new in replacements.items():
              if old not in source:
                  raise SystemExit(f"expected governed-memory test snippet not found: {old!r}")
              source = source.replace(old, new, 1)
          path.write_text(source)
          PY

          cargo fmt --all

          set +e
          cargo test --workspace \
            > .agent-ci-diagnostics/workspace-test.full.log 2>&1
          test_status=$?
          cargo clippy --workspace --all-targets -- -D warnings \
            > .agent-ci-diagnostics/workspace-clippy.full.log 2>&1
          clippy_status=$?
          set -e

          tail -n 260 .agent-ci-diagnostics/workspace-test.full.log \
            > .agent-ci-diagnostics/workspace-test.txt
          tail -n 260 .agent-ci-diagnostics/workspace-clippy.full.log \
            > .agent-ci-diagnostics/workspace-clippy.txt
          rm .agent-ci-diagnostics/*.full.log

          printf 'workspace_test=%s\nworkspace_clippy=%s\n' \
            "$test_status" "$clippy_status" \
            > .agent-ci-diagnostics/status.txt

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/mprd-core/src .agent-ci-diagnostics/*.txt
          if ! git diff --cached --quiet; then
            git commit -m "chore: capture governed-memory diagnostics"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
