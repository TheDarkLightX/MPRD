name: Agent stress MPRD tests

on:
  push:
    branches:
      - agent/governed-memory-mutations
    paths-ignore:
      - .agent-ci-diagnostics/**

permissions:
  contents: write

jobs:
  stress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true

      - uses: dtolnay/rust-toolchain@stable

      - name: Repeat workspace tests and capture first failure
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p .agent-ci-diagnostics
          overall=0
          : > .agent-ci-diagnostics/mprd-stress.txt

          for attempt in 1 2 3; do
            echo "=== attempt ${attempt} ===" >> .agent-ci-diagnostics/mprd-stress.txt
            set +e
            cargo test --workspace >> .agent-ci-diagnostics/mprd-stress.txt 2>&1
            status=$?
            set -e
            echo "attempt_${attempt}=${status}" >> .agent-ci-diagnostics/mprd-stress.txt
            if [ "$status" -ne 0 ]; then
              overall=$status
              break
            fi
          done

          tail -n 420 .agent-ci-diagnostics/mprd-stress.txt \
            > .agent-ci-diagnostics/mprd-stress-tail.txt
          printf 'overall=%s\n' "$overall" > .agent-ci-diagnostics/status.txt
          rm .agent-ci-diagnostics/mprd-stress.txt

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .agent-ci-diagnostics/*.txt
          git commit -m "chore: capture repeated MPRD test diagnostics"
          git push origin "HEAD:${GITHUB_REF_NAME}"
