name: Cargo Audit (RustSec)

on:
  pull_request:
    paths:
      - '**/Cargo.toml'
      - '**/Cargo.lock'
  push:
    branches:
      - main
    paths:
      - '**/Cargo.toml'
      - '**/Cargo.lock'
  schedule:
    - cron: '0 6 * * 1'

jobs:
  cargo-audit:
    name: cargo-audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6d9817901c499d6b02debbb57edb38d33daa680b
        with:
          toolchain: 1.87.0

      - name: Cargo cache
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5

      - name: Install cargo-audit
        env:
          CARGO_AUDIT_VERSION: 0.22.1
        run: |
          set -euo pipefail
          asset="cargo-audit-x86_64-unknown-linux-gnu-v${CARGO_AUDIT_VERSION}.tgz"
          dir="${asset%.tgz}"
          url="https://github.com/rustsec/rustsec/releases/download/cargo-audit%2Fv${CARGO_AUDIT_VERSION}/${asset}"
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          curl --fail --silent --show-error --location "$url" -o "$tmpdir/$asset"
          tar -xzf "$tmpdir/$asset" -C "$tmpdir"
          install -m 0755 "$tmpdir/$dir/cargo-audit" "$HOME/.cargo/bin/cargo-audit"
          cargo-audit --version

      - name: Seed advisory DB
        run: |
          set -euo pipefail
          rm -rf "$HOME/.cargo/advisory-db"
          git clone --depth 1 https://github.com/RustSec/advisory-db.git "$HOME/.cargo/advisory-db"

      - name: Run cargo audit
        run: cargo audit --no-fetch
