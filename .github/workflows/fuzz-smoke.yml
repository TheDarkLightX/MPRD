name: Fuzz Smoke

on:
  pull_request:
    paths:
      - '.github/workflows/fuzz-smoke.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
      - 'fuzz/**'
      - 'methods/**'
      - 'tools/fuzz.sh'
      - 'tools/fuzz_smoke_rc1.sh'
      - 'docs/FUZZING.md'
      - 'docs/RC1_BLOCKERS.md'
      - 'docs/TIER0_BOUNDARY_MATRIX.md'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/fuzz-smoke.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
      - 'fuzz/**'
      - 'methods/**'
      - 'tools/fuzz.sh'
      - 'tools/fuzz_smoke_rc1.sh'
      - 'docs/FUZZING.md'
      - 'docs/RC1_BLOCKERS.md'
      - 'docs/TIER0_BOUNDARY_MATRIX.md'
  workflow_dispatch:
    inputs:
      time_per_target:
        description: Seconds to fuzz each target
        required: false
        default: "10"
      include_asde:
        description: Include slower ASDE economic fuzz targets
        required: false
        default: "false"

permissions:
  contents: read

jobs:
  fuzz-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Resolve pinned fuzz toolchain
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_ENV"
          import tomllib
          from pathlib import Path

          data = tomllib.loads(Path("fuzz/rust-toolchain.toml").read_text())
          print(f"FUZZ_TOOLCHAIN={data['toolchain']['channel']}")
          PY

      - name: Install pinned nightly toolchain
        run: rustup toolchain install "$FUZZ_TOOLCHAIN" --profile minimal

      - name: Install cargo-fuzz
        run: cargo +"$FUZZ_TOOLCHAIN" install cargo-fuzz --locked --version 0.13.1

      - name: Run RC1 fuzz smoke campaign
        env:
          TIME_PER_TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.time_per_target || '10' }}
          INCLUDE_ASDE: ${{ github.event_name == 'workflow_dispatch' && inputs.include_asde || 'false' }}
        run: |
          set -euo pipefail
          time_arg="${TIME_PER_TARGET:-10}"
          if [[ -z "${time_arg}" ]]; then
            time_arg="10"
          fi

          extra_args=()
          if [[ "${INCLUDE_ASDE:-false}" == "true" ]]; then
            extra_args+=(--include-asde)
          fi

          tools/fuzz_smoke_rc1.sh \
            --time-per-target "${time_arg}" \
            "${extra_args[@]}" \
            --summary fuzz/artifacts/rc1_fuzz_smoke_summary.json

      - name: Upload fuzz smoke summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc1-fuzz-smoke-summary
          path: fuzz/artifacts/rc1_fuzz_smoke_summary.json
          if-no-files-found: ignore

      - name: Upload fuzz crash artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc1-fuzz-artifacts
          path: fuzz/artifacts
          if-no-files-found: ignore
